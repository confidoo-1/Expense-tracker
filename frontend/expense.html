<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="expense.css" />
  </head>

  <body>
    <main class="container">
      <h1>Expense Tracker</h1>

      <!-- Add Expense Form -->
      <section class="expense-form">
        <h2>Add Expense</h2>

        <form id="expense-form">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="e.g. Lunch" />

          <label for="amount">Amount</label>
          <input type="number" id="amount" placeholder="e.g. 2500" />

          <label for="category">Category</label>
          <select id="category">
            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="School">School</option>
            <option value="Data">Data</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>

          <label for="date">Date</label>
          <input type="date" id="date" />

          <p id="error"></p>

          <button type="submit" id="sumit_button">Add Expense</button>
        </form>
      </section>

      <select id="category-filter">
        <option value="all">All</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Data">Data</option>
        <option value="School">School</option>
        <option value="Other">Other</option>
      </select>

      <!-- Expense List -->
      <section class="expense-list">
        <h2>My Expenses</h2>

        <div id="expenses">
          <!-- Expenses will be displayed here -->
        </div>
      </section>

      <!-- Summary -->
      <section class="summary">
        <h2>Summary</h2>

        <div class="summary-items">
          <div>
            <p>Total Spent</p>
            <strong id="total">₦0</strong>
          </div>

          <div>
            <p>Number of Expenses</p>
            <strong id="expense-count">0</strong>
          </div>
        </div>
      </section>
    </main>

    <script src="expense.js"></script>
  </body>
</html>
